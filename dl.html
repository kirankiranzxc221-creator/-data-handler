<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>%s</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.6.12/plyr.css" />
    <style>
        /* Change this ONE value later to match the image's real black */
        :root { --page-bg: #060912; }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        html { background: var(--page-bg); }
        body {
            background-color: var(--page-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
        }

        /* TOP SLICE: bottom edge melts away with an eased (curved) fade */
        .header-box {
            width: 100%%;
            aspect-ratio: 864 / 288;
            background: url('https://cdn.jsdelivr.net/gh/trm-admin/-data-handler@main/images/Background.webp') center top / 100%% auto no-repeat;
            -webkit-mask-image: linear-gradient(to bottom,
                rgba(0,0,0,1) 0%%,
                rgba(0,0,0,1) 55%%,
                rgba(0,0,0,0.92) 62%%,
                rgba(0,0,0,0.78) 69%%,
                rgba(0,0,0,0.58) 76%%,
                rgba(0,0,0,0.38) 83%%,
                rgba(0,0,0,0.20) 89%%,
                rgba(0,0,0,0.08) 94%%,
                rgba(0,0,0,0.02) 97%%,
                rgba(0,0,0,0) 100%%);
            mask-image: linear-gradient(to bottom,
                rgba(0,0,0,1) 0%%,
                rgba(0,0,0,1) 55%%,
                rgba(0,0,0,0.92) 62%%,
                rgba(0,0,0,0.78) 69%%,
                rgba(0,0,0,0.58) 76%%,
                rgba(0,0,0,0.38) 83%%,
                rgba(0,0,0,0.20) 89%%,
                rgba(0,0,0,0.08) 94%%,
                rgba(0,0,0,0.02) 97%%,
                rgba(0,0,0,0) 100%%);
        }

        .movie-title {
            width: 90%%;
            text-align: center;
            color: #00ffff;
            font-size: 16px;
            font-weight: bold;
            margin: 15px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-placeholder {
            width: 90%%;
            max-width: 400px;
            aspect-ratio: 16 / 9;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
            margin: 0 auto;
            background: #000;
        }
        
        .plyr { width: 100%%; height: 100%%; }

        [data-plyr="download"] {
            display: none !important;
        }

        .choose-option {
            width: 90%%;
            max-width: 380px;
            text-align: center;
            margin-top: 4%%;
            font-family: 'Georgia', 'Times New Roman', serif;
        }
        .choose-option .line1 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            white-space: nowrap;
            background: linear-gradient(90deg, #ffffff, #cfd8ff, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 12px rgba(0, 200, 255, 0.35);
        }
        .choose-option .line1::before,
        .choose-option .line1::after {
            content: "";
            flex: 1;
            height: 2px;
            max-width: 30px;
            background: linear-gradient(90deg, transparent, #00e5ff);
            box-shadow: 0 0 6px #00e5ff;
        }
        .choose-option .line1::after { background: linear-gradient(90deg, #00e5ff, transparent); }
        .choose-option .line2 {
            font-size: 10px;
            letter-spacing: 0.5px;
            font-style: italic;
            font-weight: 700;
            color: #c9971f;
            margin-top: 6px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            width: 90%%;
            max-width: 380px;
            margin: 4%% auto 0 auto;
        }

        .btn-img {
            width: 100%%;
            height: auto;
            display: block;
            border-radius: 8px;
            margin-bottom: 4vw;
            cursor: pointer;
            filter: drop-shadow(0px 6px 8px rgba(0, 0, 0, 0.6));
            transition: transform 0.2s, filter 0.2s;
        }
        .btn-img:active {
            transform: scale(0.95);
            filter: drop-shadow(0px 3px 5px rgba(0, 0, 0, 0.6));
        }
        .btn-img:last-child { margin-bottom: 0; }

        /* BOTTOM SLICE: follows the buttons; top edge fades in with an eased (curved) fade */
        .footer-slice {
            width: 100%%;
            aspect-ratio: 864 / 190;
            margin-top: 4%%;
            background: url('https://cdn.jsdelivr.net/gh/trm-admin/-data-handler@main/images/Background.webp') center bottom / 100%% auto no-repeat;
            -webkit-mask-image: linear-gradient(to bottom,
                rgba(0,0,0,0) 0%%,
                rgba(0,0,0,0.02) 3%%,
                rgba(0,0,0,0.08) 6%%,
                rgba(0,0,0,0.20) 11%%,
                rgba(0,0,0,0.38) 17%%,
                rgba(0,0,0,0.58) 24%%,
                rgba(0,0,0,0.78) 31%%,
                rgba(0,0,0,0.92) 38%%,
                rgba(0,0,0,1) 45%%,
                rgba(0,0,0,1) 100%%);
            mask-image: linear-gradient(to bottom,
                rgba(0,0,0,0) 0%%,
                rgba(0,0,0,0.02) 3%%,
                rgba(0,0,0,0.08) 6%%,
                rgba(0,0,0,0.20) 11%%,
                rgba(0,0,0,0.38) 17%%,
                rgba(0,0,0,0.58) 24%%,
                rgba(0,0,0,0.78) 31%%,
                rgba(0,0,0,0.92) 38%%,
                rgba(0,0,0,1) 45%%,
                rgba(0,0,0,1) 100%%);
        }
    </style>
</head>
<body>

    <div class="header-box"></div>
    
    <div class="movie-title">
        <marquee direction="left">%s</marquee>
    </div>

    <div class="player-placeholder">
        <video id="main-video" class="player" playsinline controls>
            <source src="%s" type="video/mp4" />
        </video>
    </div>

    <div class="choose-option">
        <div class="line1">🎬 Choose your option</div>
        <div class="line2">Download or play in your favorite player</div>
    </div>

    <div class="buttons-container">
        <a id="link-dl" href="%s" download="%s"><img src="https://cdn.jsdelivr.net/gh/trm-admin/-data-handler@main/images/Download.webp" class="btn-img" alt="Download Video"></a>
        <a id="link-vlc" href="#"><img src="https://cdn.jsdelivr.net/gh/trm-admin/-data-handler@main/images/VLC_Player.webp" class="btn-img" alt="PLAY IN VLC"></a>
        <a id="link-playit" href="#"><img src="https://cdn.jsdelivr.net/gh/trm-admin/-data-handler@main/images/PlayIt_Player.webp" class="btn-img" alt="PLAY IN PLAYit"></a>
        <a id="link-mx" href="#"><img src="https://cdn.jsdelivr.net/gh/trm-admin/-data-handler@main/images/Mx_Player.webp" class="btn-img" alt="PLAY IN MX Player"></a>
    </div>

    <div class="footer-slice"></div>

    <script src="https://cdn.plyr.io/3.6.12/plyr.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const player = new Plyr('.player', {
                controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen']
            });

            const videoElement = document.getElementById('main-video');
            const videoSrc = videoElement.querySelector('source').src;

            document.getElementById('link-dl').addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = this.getAttribute('href');
            });

            const vlcUrl = videoSrc.replace(/^https?:\/\//, '');
            document.getElementById('link-vlc').href = "intent://" + vlcUrl + "#Intent;package=org.videolan.vlc;type=video/*;scheme=https;end";

            const playitUrl = videoSrc.replace(/^https?:\/\//, '');
            document.getElementById('link-playit').href = "intent://" + playitUrl + "#Intent;package=com.playit.videoplayer;type=video/*;scheme=https;end";

            const mxUrl = videoSrc.replace(/^https?:\/\//, '');
            document.getElementById('link-mx').href = "intent://" + mxUrl + "#Intent;package=com.mxtech.videoplayer.ad;type=video/*;scheme=https;end";
        });
    </script>
</body>
</html>
